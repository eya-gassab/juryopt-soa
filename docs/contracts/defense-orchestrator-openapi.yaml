openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8081
  description: Generated server url
tags:
- name: Defenses
  description: Gestion des demandes de soutenance de PFE et vérification d'éligibilité
- name: Slots
  description: Gestion des créneaux et salles disponibles
- name: Schedules
  description: "Optimisation gRPC, évaluation de conflits et publication officielle\
    \ SOAP"
paths:
  /api/v1/defenses/{id}:
    get:
      tags:
      - Defenses
      summary: Récupérer une demande de soutenance par identifiant
      operationId: findById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Demande introuvable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
        "200":
          description: Demande trouvée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
    put:
      tags:
      - Defenses
      summary: Mettre à jour une demande de soutenance
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefenseRequestDto"
        required: true
      responses:
        "409":
          description: Matricule déjà utilisé par une autre demande
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
        "200":
          description: Demande mise à jour
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
        "400":
          description: Données d'entrée invalides
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
        "404":
          description: Demande introuvable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
        "422":
          description: Jury non distinct ou demande déjà SCHEDULED/PUBLISHED
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
    delete:
      tags:
      - Defenses
      summary: Supprimer une demande de soutenance
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Demande supprimée
        "404":
          description: Demande introuvable
        "422":
          description: Impossible de supprimer une demande SCHEDULED/PUBLISHED
  /api/v1/slots:
    get:
      tags:
      - Slots
      summary: Lister tous les créneaux
      operationId: findAll
      responses:
        "200":
          description: Liste des créneaux retournée
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlotResponseDto"
    post:
      tags:
      - Slots
      summary: Créer un créneau/salle disponible
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlotRequestDto"
        required: true
      responses:
        "201":
          description: Créneau créé (en-tête Location renseigné)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SlotResponseDto"
        "400":
          description: Données d'entrée invalides
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SlotResponseDto"
        "409":
          description: "Le couple (créneau, salle) existe déjà"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SlotResponseDto"
  /api/v1/schedules/{id}/publications:
    post:
      tags:
      - Schedules
      summary: Publier officiellement le dernier planning DRAFT sans conflit via SOAP
      operationId: publish
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "409":
          description: Incohérence de doublon d'enregistrement SOAP
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SchedulePublicationResponseDto"
        "200":
          description: Planning publié avec les codes officiels REG-...
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SchedulePublicationResponseDto"
        "503":
          description: Service de scolarité SOAP indisponible (les succès précédents
            restent enregistrés)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SchedulePublicationResponseDto"
        "404":
          description: Planning ou étudiant introuvable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SchedulePublicationResponseDto"
        "422":
          description: "Planning non publiable (UNOPTIMIZED_FALLBACK, conflits ou\
            \ non dernier DRAFT)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SchedulePublicationResponseDto"
  /api/v1/schedules/optimization-runs:
    post:
      tags:
      - Schedules
      summary: Lancer une optimisation de planning via gRPC (avec repli séquentiel)
      operationId: createOptimizationRun
      responses:
        "201":
          description: Planning généré (DRAFT ou UNOPTIMIZED_FALLBACK)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OptimizationRunResponseDto"
        "422":
          description: Aucune demande éligible ou créneaux insuffisants
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OptimizationRunResponseDto"
  /api/v1/schedules/evaluations:
    post:
      tags:
      - Schedules
      summary: Évaluer les conflits d'un planning proposé via gRPC unaire
      operationId: evaluate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleEvaluationRequestDto"
        required: true
      responses:
        "200":
          description: Résultat d'évaluation retourné
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScheduleEvaluationResponseDto"
        "400":
          description: Requête invalide (liste vide ou champs manquants)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScheduleEvaluationResponseDto"
        "422":
          description: Rejet métier du moteur gRPC
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScheduleEvaluationResponseDto"
        "503":
          description: Service d'optimisation gRPC indisponible
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScheduleEvaluationResponseDto"
  /api/v1/defenses:
    get:
      tags:
      - Defenses
      summary: Lister toutes les demandes de soutenance
      operationId: findAll_1
      responses:
        "200":
          description: Liste des demandes retournée
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DefenseResponseDto"
    post:
      tags:
      - Defenses
      summary: Créer une demande de soutenance avec contrôle d'éligibilité SOAP
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefenseRequestDto"
        required: true
      responses:
        "400":
          description: Données d'entrée invalides
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
        "404":
          description: Étudiant inconnu auprès du service de scolarité
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
        "409":
          description: Une demande existe déjà pour ce matricule
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
        "422":
          description: Jury non distinct ou étudiant non éligible
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
        "201":
          description: Demande créée (ELIGIBLE ou PROVISIONAL_PENDING_CLEARANCE en
            repli)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
  /api/v1/defenses/{id}/clearances:
    post:
      tags:
      - Defenses
      summary: Revérifier l'éligibilité d'une demande provisoire auprès de la scolarité
      operationId: recheckClearance
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Demande ou étudiant introuvable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
        "200":
          description: Éligibilité confirmée (statut passé à ELIGIBLE)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
        "503":
          description: Service de scolarité temporairement indisponible
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
        "422":
          description: Demande non provisoire ou étudiant non éligible
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefenseResponseDto"
components:
  schemas:
    DefenseRequestDto:
      required:
      - presidentCode
      - projectTitle
      - rapporteurCode
      - studentMatricule
      - supervisorCode
      type: object
      properties:
        studentMatricule:
          maxLength: 20
          minLength: 0
          pattern: "^ETU-\\d{4}-\\d{3}$"
          type: string
          example: ETU-2026-001
        studentName:
          maxLength: 120
          minLength: 0
          type: string
          nullable: true
          example: Amine Ben Salem
        projectTitle:
          maxLength: 200
          minLength: 5
          type: string
          example: Plateforme SOA de planification des soutenances
        supervisorCode:
          pattern: "^PROF-\\d{2,4}$"
          type: string
          example: PROF-01
        presidentCode:
          pattern: "^PROF-\\d{2,4}$"
          type: string
          example: PROF-02
        rapporteurCode:
          pattern: "^PROF-\\d{2,4}$"
          type: string
          example: PROF-03
    DefenseResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        studentMatricule:
          type: string
        studentName:
          type: string
        projectTitle:
          type: string
        supervisorCode:
          type: string
        presidentCode:
          type: string
        rapporteurCode:
          type: string
        status:
          type: string
          enum:
          - PROVISIONAL_PENDING_CLEARANCE
          - ELIGIBLE
          - SCHEDULED
          - PUBLISHED
        clearanceToken:
          type: string
        registryCode:
          type: string
        assignedSlotCode:
          type: string
        assignedRoomCode:
          type: string
    SlotRequestDto:
      required:
      - roomCode
      - slotCode
      type: object
      properties:
        slotCode:
          pattern: "^\\d{4}-\\d{2}-\\d{2}_\\d{2}:\\d{2}$"
          type: string
          example: 2026-06-15_09:00
        roomCode:
          pattern: "^[A-Z]+-[A-Z0-9]+$"
          type: string
          example: SALLE-A1
        available:
          type: boolean
          example: true
          default: true
    SlotResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slotCode:
          type: string
        roomCode:
          type: string
        available:
          type: boolean
    PublishedDefenseDto:
      type: object
      properties:
        defenseId:
          type: integer
          format: int64
        studentMatricule:
          type: string
        registryCode:
          type: string
        status:
          type: string
          enum:
          - PROVISIONAL_PENDING_CLEARANCE
          - ELIGIBLE
          - SCHEDULED
          - PUBLISHED
        alreadyRegistered:
          type: boolean
    SchedulePublicationResponseDto:
      type: object
      properties:
        scheduleId:
          type: integer
          format: int64
        scheduleStatus:
          type: string
          enum:
          - DRAFT
          - UNOPTIMIZED_FALLBACK
          - PUBLISHED
        publishedCount:
          type: integer
          format: int32
        defenses:
          type: array
          items:
            $ref: "#/components/schemas/PublishedDefenseDto"
    OptimizationRunResponseDto:
      type: object
      properties:
        scheduleId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - DRAFT
          - UNOPTIMIZED_FALLBACK
          - PUBLISHED
        fallbackUsed:
          type: boolean
        totalAssigned:
          type: integer
          format: int32
        conflictCount:
          type: integer
          format: int32
        balanceScore:
          type: number
          format: double
        steps:
          type: array
          items:
            $ref: "#/components/schemas/OptimizationStepDto"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/ProposedAssignmentDto"
    OptimizationStepDto:
      type: object
      properties:
        stage:
          type: string
        passNumber:
          type: integer
          format: int32
        assignedCount:
          type: integer
          format: int32
        conflictCount:
          type: integer
          format: int32
        balanceScore:
          type: number
          format: double
    ProposedAssignmentDto:
      required:
      - presidentCode
      - rapporteurCode
      - requestId
      - roomCode
      - slotCode
      - supervisorCode
      type: object
      properties:
        requestId:
          type: string
          example: "1"
        slotCode:
          type: string
          example: 2026-06-15_09:00
        roomCode:
          type: string
          example: SALLE-A1
        supervisorCode:
          type: string
          example: PROF-01
        presidentCode:
          type: string
          example: PROF-02
        rapporteurCode:
          type: string
          example: PROF-03
    ScheduleEvaluationRequestDto:
      required:
      - assignments
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/ProposedAssignmentDto"
    ConflictDto:
      type: object
      properties:
        type:
          type: string
        slotCode:
          type: string
        resourceCode:
          type: string
        requestIds:
          type: array
          items:
            type: string
    ScheduleEvaluationResponseDto:
      type: object
      properties:
        valid:
          type: boolean
        conflictCount:
          type: integer
          format: int32
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/ConflictDto"
