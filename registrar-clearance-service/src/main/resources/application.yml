spring:
  application:
    name: registrar-clearance-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/registrar_db}
    username: ${SPRING_DATASOURCE_USERNAME:juryopt}
    password: ${SPRING_DATASOURCE_PASSWORD:juryopt}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info