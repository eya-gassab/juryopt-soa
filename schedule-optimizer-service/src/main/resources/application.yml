spring:
  application:
    name: schedule-optimizer-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/optimizer_db}
    username: ${SPRING_DATASOURCE_USERNAME:juryopt}
    password: ${SPRING_DATASOURCE_PASSWORD:juryopt}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

# Port HTTP dédié à Actuator (/actuator/health)
server:
  port: 8082

# Port du serveur gRPC
grpc:
  server:
    port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,info