spring:
  application:
    name: defense-orchestrator-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/defense_db}
    username: ${SPRING_DATASOURCE_USERNAME:juryopt}
    password: ${SPRING_DATASOURCE_PASSWORD:juryopt}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html